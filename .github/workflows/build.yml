name: Build
permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Feature-branch pushes are not a second trigger. pull_request already runs
# those commits, and a second workflow on the same Intel runner cancels the
# first. push covers master after a merge.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: xcode-modules-${{ runner.os }}-${{ hashFiles('Moonlight.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            xcode-modules-${{ runner.os }}-

      - name: Download iOS platform
        run: bash scripts/ci/download-platform.sh iOS iphonesimulator

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -sdk iphonesimulator build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Release -sdk iphonesimulator build

  visionos:
    name: Build visionOS simulator
    needs: [build]
    runs-on: macos-26-intel
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download visionOS platform
        id: platform
        continue-on-error: true
        run: bash scripts/ci/download-platform.sh visionOS xrsimulator

      - name: Check the visionOS Simulator destination
        env:
          VISIONOS_PLATFORM_READY: ${{ steps.platform.outcome == 'success' && '1' || '0' }}
        run: bash scripts/ci/visionos-check.sh

  ios27-launch:
    name: Launch on iOS 27
    needs: [visionos]
    if: ${{ !cancelled() }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download iOS platform
        run: bash scripts/ci/download-platform.sh iOS iphonesimulator

      - name: Launch on iOS 27 or skip when that runtime is absent
        run: bash scripts/ci/launch-ios27.sh

  test:
    name: Test iOS Simulator
    needs: [build, ios27-launch]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-26-intel
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: xcode-modules-${{ runner.os }}-${{ hashFiles('Moonlight.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            xcode-modules-${{ runner.os }}-

      - name: Download iOS platform
        run: bash scripts/ci/download-platform.sh iOS iphonesimulator

      - name: Run unit and UI tests
        run: bash scripts/ci/run-simulator-tests.sh

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-screenshots
          path: ui-test-screenshots/
          if-no-files-found: warn

  screenshots:
    name: UI screenshots
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: xcode-modules-${{ runner.os }}-${{ hashFiles('Moonlight.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            xcode-modules-${{ runner.os }}-

      - name: Download iOS platform
        run: bash scripts/ci/download-platform.sh iOS iphonesimulator

      - name: Capture screenshots
        run: bash scripts/ci/capture-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
