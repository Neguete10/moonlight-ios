name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            sdk: iphonesimulator
            platform: iOS
          - scheme: Moonlight TV
            sdk: appletvsimulator
            platform: tvOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download ${{ matrix.platform }} platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform ${{ matrix.platform }}; then
              exit 0
            fi
            echo "Platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "Platform download failed after 3 attempts"
          exit 1

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug -sdk ${{ matrix.sdk }} clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release -sdk ${{ matrix.sdk }} clean build

  visionos:
    name: Build (visionOS simulator, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download visionOS platform
        id: platform
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform visionOS; then
              exit 0
            fi
            echo "visionOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build Moonlight for the visionOS Simulator, or explain why it cannot
        run: |
          set +e
          if [ "${{ steps.platform.outcome }}" != "success" ]; then
            echo "visionOS platform download did not succeed."
            echo "The Moonlight scheme stays an iPhone and iPad app. This job does not affect those builds."
            exit 0
          fi
          dest_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -showdestinations >"$dest_log" 2>&1
          python3 - "$dest_log" << 'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          available = text.split("Available destinations", 1)[-1].split("Ineligible destinations", 1)[0]
          sys.exit(0 if "visionOS Simulator" in available else 1)
          PY
          has_destination=$?
          if [ "$has_destination" -ne 0 ]; then
            echo "The Moonlight scheme has no visionOS Simulator destination, so it was not built as a native visionOS app."
            echo "TARGETED_DEVICE_FAMILY is 1,2 and SDKROOT is iphoneos. On Apple Vision Pro this binary runs as the existing iPad app."
            echo "A native visionOS build needs its own target before this destination exists."
            echo "Destinations from xcodebuild:"
            cat "$dest_log"
            exit 0
          fi
          build_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -destination "generic/platform=visionOS Simulator" build >"$build_log" 2>&1
          build_status=$?
          cat "$build_log"
          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi
          if grep -E -q "Unable to find a destination|supported destinations|not compatible with visionOS|supported platforms" "$build_log"; then
            echo "The Moonlight scheme cannot target the visionOS Simulator without a project change."
            echo "It remains the iPhone and iPad app, which runs on Vision Pro as Designed for iPad."
            exit 0
          fi
          echo "The visionOS Simulator build of the Moonlight scheme failed. See the log above for what a native build would break."
          echo "This job does not fail the iPhone or Apple TV builds."
          exit "$build_status"

  ios27-launch:
    name: Launch (iOS 27 simulator, if installed)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 3 attempts"
          exit 1

      - name: Launch on iOS 27 or skip when that runtime is absent
        run: |
          set -euo pipefail
          runtime_id="$(python3 - << 'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"])
          data = json.loads(raw)
          chosen = ""
          for runtime in data.get("runtimes", []):
              if not runtime.get("isAvailable", False):
                  continue
              name = runtime.get("name", "")
              version = str(runtime.get("version", ""))
              identifier = runtime.get("identifier", "")
              platform = runtime.get("platform", "")
              is_ios = platform == "iOS" or name.startswith("iOS") or ".iOS." in identifier or "iOS-" in identifier
              is_27 = version.startswith("27") or name.startswith("iOS 27") or "iOS-27" in identifier
              if is_ios and is_27:
                  chosen = identifier
                  break
          print(chosen if chosen else "NO_IOS_27")
          PY
          )"
          if [ "$runtime_id" = "NO_IOS_27" ]; then
            echo "No iOS 27 simulator runtime is installed on this runner."
            echo "The launch check is skipped. The iPhone, Apple TV, and visionOS jobs are unaffected."
            echo "Installed runtimes:"
            xcrun simctl list runtimes
            exit 0
          fi
          echo "Using iOS 27 runtime $runtime_id"
          devicetype="$(python3 - << 'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          chosen = ""
          for device in data.get("devicetypes", []):
              name = device.get("name", "")
              if name.startswith("iPhone"):
                  chosen = device["identifier"]
                  # Prefer a recent iPhone, but any iPhone type can boot the runtime.
                  if "iPhone 16" in name or "iPhone 17" in name:
                      break
          if not chosen:
              raise SystemExit("No iPhone simulator device type is installed")
          print(chosen)
          PY
          )"
          udid="$(xcrun simctl create "Twilight iOS 27 Launch" "$devicetype" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          derived="${RUNNER_TEMP:-/tmp}/twilight-ios27"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$derived" \
            build
          app="$(find "$derived/Build/Products" -type d -name 'Moonlight.app' | head -1)"
          if [ -z "$app" ]; then
            echo "Moonlight.app was not produced for the iOS 27 simulator."
            exit 1
          fi
          xcrun simctl install "$udid" "$app"
          reports="${HOME}/Library/Logs/DiagnosticReports"
          before="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$before" || true
          set +e
          launch_out="$(xcrun simctl launch "$udid" io.github.neguete10.twilight.ios 2>&1)"
          launch_status=$?
          set -e
          echo "simctl launch ($launch_status): $launch_out"
          if [ "$launch_status" -ne 0 ]; then
            echo "simctl launch failed. iOS 27 exits here when the app has no scene lifecycle."
            exit 1
          fi
          pid="${launch_out##* }"
          sleep 3
          alive=0
          if kill -0 "$pid" 2>/dev/null; then
            alive=1
          elif xcrun simctl spawn "$udid" launchctl print "pid/$pid" >/dev/null 2>&1; then
            alive=1
          fi
          after="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$after" || true
          new_reports="$(comm -13 "$before" "$after" || true)"
          relevant="$(printf '%s\n' "$new_reports" | grep -E 'Moonlight|Twilight|twilight' || true)"
          if [ -n "$relevant" ]; then
            echo "New Twilight crash reports after launch:"
            echo "$relevant"
            printf '%s\n' "$relevant" | while IFS= read -r report; do
              [ -n "$report" ] && echo "----- $report -----" && head -c 4000 "$report" || true
              echo
            done
          fi
          if [ "$alive" -ne 1 ]; then
            echo "Twilight exited within 3 seconds of launch on the iOS 27 simulator (pid $pid)."
            echo "iOS 27 enforces the UIScene lifecycle. An early EXC_BREAKPOINT in UIApplicationMain means the scene manifest or SceneDelegate did not keep the process up."
            exit 1
          fi
          if [ -n "$relevant" ]; then
            echo "Twilight was still running, but a new crash report appeared during launch."
            exit 1
          fi
          echo "Twilight was still running 3 seconds after launch on iOS 27."
