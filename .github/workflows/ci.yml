name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "Platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "Platform download failed after 3 attempts"
          exit 1

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight" -configuration Debug -sdk iphonesimulator clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight" -configuration Release -sdk iphonesimulator clean build

  build-tvos:
    name: Build (tvOS)
    # Start this job only after iOS finishes. A matrix leg queued at the
    # same time was cancelled when the runner wait overlapped the first build.
    needs: [build]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download tvOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform tvOS; then
              exit 0
            fi
            echo "Platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "Platform download failed after 3 attempts"
          exit 1

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight TV" -configuration Debug -sdk appletvsimulator clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight TV" -configuration Release -sdk appletvsimulator clean build

  visionos:
    name: Build (visionOS simulator, non-blocking)
    needs: [build-tvos]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download visionOS platform
        id: platform
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform visionOS; then
              exit 0
            fi
            echo "visionOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build Moonlight for the visionOS Simulator, or explain why it cannot
        run: |
          set +e
          if [ "${{ steps.platform.outcome }}" != "success" ]; then
            echo "visionOS platform download did not succeed."
            echo "The Moonlight scheme stays an iPhone and iPad app. This job does not affect those builds."
            exit 0
          fi
          dest_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -showdestinations >"$dest_log" 2>&1
          python3 - "$dest_log" << 'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          available = text.split("Available destinations", 1)[-1].split("Ineligible destinations", 1)[0]
          sys.exit(0 if "visionOS Simulator" in available else 1)
          PY
          has_destination=$?
          if [ "$has_destination" -ne 0 ]; then
            echo "The Moonlight scheme has no visionOS Simulator destination, so it was not built as a native visionOS app."
            echo "TARGETED_DEVICE_FAMILY is 1,2 and SDKROOT is iphoneos. On Apple Vision Pro this binary runs as the existing iPad app."
            echo "A native visionOS build needs its own target before this destination exists."
            echo "Destinations from xcodebuild:"
            cat "$dest_log"
            exit 0
          fi
          build_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -destination "generic/platform=visionOS Simulator" build >"$build_log" 2>&1
          build_status=$?
          cat "$build_log"
          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi
          if grep -E -q "Unable to find a destination|supported destinations|not compatible with visionOS|supported platforms" "$build_log"; then
            echo "The Moonlight scheme cannot target the visionOS Simulator without a project change."
            echo "It remains the iPhone and iPad app, which runs on Vision Pro as Designed for iPad."
            exit 0
          fi
          echo "The visionOS Simulator build of the Moonlight scheme failed. See the log above for what a native build would break."
          echo "This job does not fail the iPhone or Apple TV builds."
          exit "$build_status"

  ios27-launch:
    name: Launch (iOS 27 simulator, if installed)
    needs: [visionos]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 3 attempts"
          exit 1

      - name: Launch on iOS 27 or skip when that runtime is absent
        run: |
          set -euo pipefail
          runtime_id="$(python3 - << 'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"])
          data = json.loads(raw)
          chosen = ""
          for runtime in data.get("runtimes", []):
              if not runtime.get("isAvailable", False):
                  continue
              name = runtime.get("name", "")
              version = str(runtime.get("version", ""))
              identifier = runtime.get("identifier", "")
              platform = runtime.get("platform", "")
              is_ios = platform == "iOS" or name.startswith("iOS") or ".iOS." in identifier or "iOS-" in identifier
              is_27 = version.startswith("27") or name.startswith("iOS 27") or "iOS-27" in identifier
              if is_ios and is_27:
                  chosen = identifier
                  break
          print(chosen if chosen else "NO_IOS_27")
          PY
          )"
          if [ "$runtime_id" = "NO_IOS_27" ]; then
            echo "No iOS 27 simulator runtime is installed on this runner."
            echo "The launch check is skipped. The iPhone, Apple TV, and visionOS jobs are unaffected."
            echo "Installed runtimes:"
            xcrun simctl list runtimes
            exit 0
          fi
          echo "Using iOS 27 runtime $runtime_id"
          devicetype="$(python3 - << 'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          chosen = ""
          for device in data.get("devicetypes", []):
              name = device.get("name", "")
              if name.startswith("iPhone"):
                  chosen = device["identifier"]
                  # Prefer a recent iPhone, but any iPhone type can boot the runtime.
                  if "iPhone 16" in name or "iPhone 17" in name:
                      break
          if not chosen:
              raise SystemExit("No iPhone simulator device type is installed")
          print(chosen)
          PY
          )"
          udid="$(xcrun simctl create "Twilight iOS 27 Launch" "$devicetype" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          derived="${RUNNER_TEMP:-/tmp}/twilight-ios27"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$derived" \
            build
          app="$(find "$derived/Build/Products" -type d -name 'Moonlight.app' | head -1)"
          if [ -z "$app" ]; then
            echo "Moonlight.app was not produced for the iOS 27 simulator."
            exit 1
          fi
          xcrun simctl install "$udid" "$app"
          reports="${HOME}/Library/Logs/DiagnosticReports"
          before="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$before" || true
          set +e
          launch_out="$(xcrun simctl launch "$udid" io.github.neguete10.twilight.ios 2>&1)"
          launch_status=$?
          set -e
          echo "simctl launch ($launch_status): $launch_out"
          if [ "$launch_status" -ne 0 ]; then
            echo "simctl launch failed. iOS 27 exits here when the app has no scene lifecycle."
            exit 1
          fi
          pid="${launch_out##* }"
          sleep 3
          alive=0
          if kill -0 "$pid" 2>/dev/null; then
            alive=1
          elif xcrun simctl spawn "$udid" launchctl print "pid/$pid" >/dev/null 2>&1; then
            alive=1
          fi
          after="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$after" || true
          new_reports="$(comm -13 "$before" "$after" || true)"
          relevant="$(printf '%s\n' "$new_reports" | grep -E 'Moonlight|Twilight|twilight' || true)"
          if [ -n "$relevant" ]; then
            echo "New Twilight crash reports after launch:"
            echo "$relevant"
            printf '%s\n' "$relevant" | while IFS= read -r report; do
              [ -n "$report" ] && echo "----- $report -----" && head -c 4000 "$report" || true
              echo
            done
          fi
          if [ "$alive" -ne 1 ]; then
            echo "Twilight exited within 3 seconds of launch on the iOS 27 simulator (pid $pid)."
            echo "iOS 27 enforces the UIScene lifecycle. An early EXC_BREAKPOINT in UIApplicationMain means the scene manifest or SceneDelegate did not keep the process up."
            exit 1
          fi
          if [ -n "$relevant" ]; then
            echo "Twilight was still running, but a new crash report appeared during launch."
            exit 1
          fi
          echo "Twilight was still running 3 seconds after launch on iOS 27."

  ui-screenshots:
    name: UI screenshots (iOS Simulator)
    needs: [build, build-tvos, visionos, ios27-launch]
    if: ${{ always() && needs.build.result == 'success' && needs.build-tvos.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 3 attempts"
          exit 1

      - name: Capture before and after screenshots
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/ui-screenshots"
          mkdir -p "$out"
          git fetch origin cursor/twilight-ios-phase4-271e
          before_sha="$(git rev-parse origin/cursor/twilight-ios-phase4-271e)"
          git worktree add --detach /tmp/twilight-before "$before_sha"
          git -C /tmp/twilight-before submodule update --init --recursive

          python3 - << 'PY'
          import json, subprocess, sys
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))
          ios = [r for r in runtimes.get("runtimes", []) if r.get("isAvailable") and str(r.get("platform")) == "iOS"]
          if not ios:
              print("NO_IOS_RUNTIME")
              sys.exit(0)
          ios.sort(key=lambda r: [int(p) if p.isdigit() else 0 for p in str(r.get("version", "0")).split(".")])
          chosen = ios[-1]
          open("/tmp/twilight-runtime-id", "w").write(chosen["identifier"])
          print(chosen["identifier"], chosen.get("version"))
          PY
          if [ ! -s /tmp/twilight-runtime-id ]; then
            echo "No iOS simulator runtime is installed, so UI screenshots were not captured."
            exit 1
          fi
          runtime_id="$(cat /tmp/twilight-runtime-id)"

          python3 - "$runtime_id" << 'PY'
          import json, subprocess, sys
          runtime = sys.argv[1]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          names = [d.get("name", "") for d in types.get("devicetypes", [])]
          def pick(prefixes):
              for prefix in prefixes:
                  for name in names:
                      if name.startswith(prefix):
                          return name
              return None
          iphone = pick(["iPhone 17", "iPhone 16", "iPhone"])
          ipad = pick(["iPad Pro 13", "iPad Pro 11", "iPad"])
          if not iphone or not ipad:
              sys.exit("Could not find an iPhone and iPad simulator device type")
          open("/tmp/twilight-iphone-type", "w").write(iphone)
          open("/tmp/twilight-ipad-type", "w").write(ipad)
          print(iphone)
          print(ipad)
          PY

          build_app() {
            local src="$1"
            local dd="$2"
            local appfile="$3"
            if ! xcodebuild -project "$src/Moonlight.xcodeproj" -scheme Moonlight -configuration Debug -sdk iphonesimulator -derivedDataPath "$dd" build >"$dd-build.log" 2>&1; then
              echo "xcodebuild failed for $src"
              tail -n 80 "$dd-build.log"
              exit 1
            fi
            find "$dd/Build/Products" -name Moonlight.app -path '*iphonesimulator*' | head -1 > "$appfile" || true
          }

          echo "Building the phase 4 UI for the before shots"
          build_app /tmp/twilight-before /tmp/dd-before /tmp/twilight-before-app
          echo "Building this commit for the after shots"
          build_app "$GITHUB_WORKSPACE" /tmp/dd-after /tmp/twilight-after-app
          before_app="$(cat /tmp/twilight-before-app)"
          after_app="$(cat /tmp/twilight-after-app)"
          echo "Before app: $before_app"
          echo "After app: $after_app"
          test -d "$before_app"
          test -d "$after_app"

          boot_device() {
            local name="$1"
            local type="$2"
            local udid
            udid="$(xcrun simctl create "$name" "$type" "$runtime_id")"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            printf '%s' "$udid" > /tmp/twilight-booted-udid
          }

          shot() {
            local udid="$1"
            local app="$2"
            local appearance="$3"
            local mode="$4"
            local file="$5"
            xcrun simctl ui "$udid" appearance "$appearance" || true
            xcrun simctl terminate "$udid" io.github.neguete10.twilight.ios || true
            xcrun simctl install "$udid" "$app"
            if [ -n "$mode" ]; then
              SIMCTL_CHILD_TWILIGHT_SCREENSHOT="$mode" xcrun simctl launch "$udid" io.github.neguete10.twilight.ios
            else
              xcrun simctl launch "$udid" io.github.neguete10.twilight.ios
            fi
            sleep 5
            xcrun simctl io "$udid" screenshot "$file"
            echo "Wrote $file"
          }

          # simctl ui has no orientation command on this runner. Rotate the
          # already-running Simulator with the same shortcut the menu uses.
          rotate_simulator() {
            local keycode="$1"
            osascript -e 'tell application "Simulator" to activate' \
              -e 'delay 0.4' \
              -e "tell application \"System Events\" to key code ${keycode} using command down" || true
            sleep 2
          }

          boot_device "Twilight iPhone" "$(cat /tmp/twilight-iphone-type)"
          iphone="$(cat /tmp/twilight-booted-udid)"
          shot "$iphone" "$before_app" light "" "$out/before-iphone-hosts-light.png"
          shot "$iphone" "$before_app" dark "" "$out/before-iphone-hosts-dark.png"
          shot "$iphone" "$after_app" light hosts "$out/after-iphone-hosts-light.png"
          shot "$iphone" "$after_app" dark hosts "$out/after-iphone-hosts-dark.png"
          shot "$iphone" "$after_app" light library "$out/after-iphone-library-light.png"
          shot "$iphone" "$after_app" dark library "$out/after-iphone-library-dark.png"
          rotate_simulator 123
          xcrun simctl io "$iphone" screenshot "$out/after-iphone-library-landscape-light.png"
          echo "Wrote $out/after-iphone-library-landscape-light.png"
          rotate_simulator 124
          shot "$iphone" "$after_app" light settings "$out/after-iphone-settings-light.png"
          shot "$iphone" "$after_app" light loading "$out/after-iphone-loading-light.png"
          xcrun simctl shutdown "$iphone" || true

          boot_device "Twilight iPad" "$(cat /tmp/twilight-ipad-type)"
          ipad="$(cat /tmp/twilight-booted-udid)"
          shot "$ipad" "$before_app" light "" "$out/before-ipad-hosts-light.png"
          shot "$ipad" "$after_app" light hosts "$out/after-ipad-hosts-light.png"
          shot "$ipad" "$after_app" light library "$out/after-ipad-library-light.png"
          xcrun simctl shutdown "$ipad" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
