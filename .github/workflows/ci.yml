name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: twilight-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS)
    # Public Intel image with Xcode 26.6. macos-latest is the arm64 pool that
    # has not been acquiring a runner.
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "Platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "Platform download failed after 3 attempts"
          exit 1

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight" -configuration Debug -sdk iphonesimulator clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight" -configuration Release -sdk iphonesimulator clean build

  build-tvos:
    name: Build (tvOS)
    # Start this job only after iOS finishes. A matrix leg queued at the
    # same time was cancelled when the runner wait overlapped the first build.
    needs: [build]
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download tvOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform tvOS; then
              exit 0
            fi
            echo "Platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "Platform download failed after 3 attempts"
          exit 1

      - name: Build Debug
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight TV" -configuration Debug -sdk appletvsimulator clean build

      - name: Build Release
        run: xcodebuild -project Moonlight.xcodeproj -scheme "Moonlight TV" -configuration Release -sdk appletvsimulator clean build

  visionos:
    name: Build (visionOS simulator, non-blocking)
    needs: [build-tvos]
    runs-on: macos-26-intel
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download visionOS platform
        id: platform
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform visionOS; then
              exit 0
            fi
            echo "visionOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build Moonlight for the visionOS Simulator, or explain why it cannot
        run: |
          set +e
          if [ "${{ steps.platform.outcome }}" != "success" ]; then
            echo "visionOS platform download did not succeed."
            echo "The Moonlight scheme stays an iPhone and iPad app. This job does not affect those builds."
            exit 0
          fi
          dest_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -showdestinations >"$dest_log" 2>&1
          python3 - "$dest_log" << 'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          available = text.split("Available destinations", 1)[-1].split("Ineligible destinations", 1)[0]
          sys.exit(0 if "visionOS Simulator" in available else 1)
          PY
          has_destination=$?
          if [ "$has_destination" -ne 0 ]; then
            echo "The Moonlight scheme has no visionOS Simulator destination, so it was not built as a native visionOS app."
            echo "TARGETED_DEVICE_FAMILY is 1,2 and SDKROOT is iphoneos. On Apple Vision Pro this binary runs as the existing iPad app."
            echo "A native visionOS build needs its own target before this destination exists."
            echo "Destinations from xcodebuild:"
            cat "$dest_log"
            exit 0
          fi
          build_log="$(mktemp)"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -destination "generic/platform=visionOS Simulator" build >"$build_log" 2>&1
          build_status=$?
          cat "$build_log"
          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi
          if grep -E -q "Unable to find a destination|supported destinations|not compatible with visionOS|supported platforms" "$build_log"; then
            echo "The Moonlight scheme cannot target the visionOS Simulator without a project change."
            echo "It remains the iPhone and iPad app, which runs on Vision Pro as Designed for iPad."
            exit 0
          fi
          echo "The visionOS Simulator build of the Moonlight scheme failed. See the log above for what a native build would break."
          echo "This job does not fail the iPhone or Apple TV builds."
          exit "$build_status"

  ios27-launch:
    name: Launch (iOS 27 simulator, if installed)
    needs: [visionos]
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 3 attempts"
          exit 1

      - name: Launch on iOS 27 or skip when that runtime is absent
        run: |
          set -euo pipefail
          runtime_id="$(python3 - << 'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"])
          data = json.loads(raw)
          chosen = ""
          for runtime in data.get("runtimes", []):
              if not runtime.get("isAvailable", False):
                  continue
              name = runtime.get("name", "")
              version = str(runtime.get("version", ""))
              identifier = runtime.get("identifier", "")
              platform = runtime.get("platform", "")
              is_ios = platform == "iOS" or name.startswith("iOS") or ".iOS." in identifier or "iOS-" in identifier
              is_27 = version.startswith("27") or name.startswith("iOS 27") or "iOS-27" in identifier
              if is_ios and is_27:
                  chosen = identifier
                  break
          print(chosen if chosen else "NO_IOS_27")
          PY
          )"
          if [ "$runtime_id" = "NO_IOS_27" ]; then
            echo "No iOS 27 simulator runtime is installed on this runner."
            echo "The launch check is skipped. The iPhone, Apple TV, and visionOS jobs are unaffected."
            echo "Installed runtimes:"
            xcrun simctl list runtimes
            exit 0
          fi
          echo "Using iOS 27 runtime $runtime_id"
          devicetype="$(python3 - << 'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          chosen = ""
          for device in data.get("devicetypes", []):
              name = device.get("name", "")
              if name.startswith("iPhone"):
                  chosen = device["identifier"]
                  # Prefer a recent iPhone, but any iPhone type can boot the runtime.
                  if "iPhone 16" in name or "iPhone 17" in name:
                      break
          if not chosen:
              raise SystemExit("No iPhone simulator device type is installed")
          print(chosen)
          PY
          )"
          udid="$(xcrun simctl create "Twilight iOS 27 Launch" "$devicetype" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          derived="${RUNNER_TEMP:-/tmp}/twilight-ios27"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$derived" \
            build
          app="$(find "$derived/Build/Products" -type d -name 'Moonlight.app' | head -1)"
          if [ -z "$app" ]; then
            echo "Moonlight.app was not produced for the iOS 27 simulator."
            exit 1
          fi
          xcrun simctl install "$udid" "$app"
          reports="${HOME}/Library/Logs/DiagnosticReports"
          before="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$before" || true
          set +e
          launch_out="$(xcrun simctl launch "$udid" io.github.neguete10.twilight.ios 2>&1)"
          launch_status=$?
          set -e
          echo "simctl launch ($launch_status): $launch_out"
          if [ "$launch_status" -ne 0 ]; then
            echo "simctl launch failed. iOS 27 exits here when the app has no scene lifecycle."
            exit 1
          fi
          pid="${launch_out##* }"
          sleep 3
          alive=0
          if kill -0 "$pid" 2>/dev/null; then
            alive=1
          elif xcrun simctl spawn "$udid" launchctl print "pid/$pid" >/dev/null 2>&1; then
            alive=1
          fi
          after="$(mktemp)"
          find "$reports" \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | sort > "$after" || true
          new_reports="$(comm -13 "$before" "$after" || true)"
          relevant="$(printf '%s\n' "$new_reports" | grep -E 'Moonlight|Twilight|twilight' || true)"
          if [ -n "$relevant" ]; then
            echo "New Twilight crash reports after launch:"
            echo "$relevant"
            printf '%s\n' "$relevant" | while IFS= read -r report; do
              [ -n "$report" ] && echo "----- $report -----" && head -c 4000 "$report" || true
              echo
            done
          fi
          if [ "$alive" -ne 1 ]; then
            echo "Twilight exited within 3 seconds of launch on the iOS 27 simulator (pid $pid)."
            echo "iOS 27 enforces the UIScene lifecycle. An early EXC_BREAKPOINT in UIApplicationMain means the scene manifest or SceneDelegate did not keep the process up."
            exit 1
          fi
          if [ -n "$relevant" ]; then
            echo "Twilight was still running, but a new crash report appeared during launch."
            exit 1
          fi
          echo "Twilight was still running 3 seconds after launch on iOS 27."

  test:
    name: Tests (iOS Simulator)
    needs: [build, build-tvos, visionos, ios27-launch]
    if: ${{ always() && needs.build.result == 'success' && needs.build-tvos.result == 'success' }}
    runs-on: macos-26-intel
    # simctl bootstatus used to wait forever. A cold xcodebuild plus one
    # iPhone pass and one iPad pass needs most of this window; the per-command
    # cap below kills a simulator that never boots.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: |
          set -euo pipefail
          # The download talks to CoreSimulator. Right after a cancelled job
          # that service answers "Unable to connect", then recovers. A hung
          # download is still capped so the tests can start.
          for attempt in 1 2 3 4; do
            xcrun simctl list devices >/dev/null 2>&1 || true
            set +e
            python3 - << 'PY'
          import subprocess, sys
          try:
              code = subprocess.run(["xcodebuild", "-downloadPlatform", "iOS"], timeout=480).returncode
          except subprocess.TimeoutExpired:
              print("iOS platform download exceeded 8 minutes", flush=True)
              sys.exit(1)
          sys.exit(code)
          PY
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if xcodebuild -showsdks 2>/dev/null | grep -q iphonesimulator; then
              echo "iOS simulator SDK is already installed"
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 4 attempts"
          exit 1

      - name: Run unit and UI tests
        run: |
          set -euo pipefail
          # The software keyboard stays hidden while Simulator treats a
          # hardware keyboard as connected, and the three-finger test needs it.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

          python3 - << 'PY'
          import json, subprocess, sys
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))
          ios = [r for r in runtimes.get("runtimes", []) if r.get("isAvailable") and str(r.get("platform")) == "iOS"]
          if not ios:
              sys.exit("No iOS simulator runtime is installed")
          ios.sort(key=lambda r: [int(p) if p.isdigit() else 0 for p in str(r.get("version", "0")).split(".")])
          chosen = ios[-1]
          open("/tmp/twilight-test-runtime", "w").write(chosen["identifier"])
          print(chosen["identifier"], chosen.get("version"))
          PY
          runtime_id="$(cat /tmp/twilight-test-runtime)"

          python3 - "$runtime_id" << 'PY'
          import json, subprocess, sys
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          names = [d.get("name", "") for d in types.get("devicetypes", [])]
          def pick(exact, prefixes):
              for name in exact:
                  if name in names:
                      return name
              for prefix in prefixes:
                  for name in names:
                      if name.startswith(prefix):
                          return name
              return ""
          iphone = pick(["iPhone 17 Pro"], ["iPhone 17", "iPhone 16 Pro", "iPhone 16", "iPhone"])
          large = pick(["iPhone 17 Pro Max", "iPhone 16 Pro Max"], ["iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone Air"])
          if large == iphone:
              large = ""
          ipad = pick(
              ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"],
              ["iPad Pro 13", "iPad Pro 11", "iPad"],
          )
          if not iphone:
              sys.exit("No iPhone simulator device type is installed")
          open("/tmp/twilight-test-iphone", "w").write(iphone)
          open("/tmp/twilight-test-large", "w").write(large)
          open("/tmp/twilight-test-ipad", "w").write(ipad)
          print("iphone", iphone)
          print("large", large or "(none)")
          print("ipad", ipad or "(none)")
          PY

          derived="${RUNNER_TEMP:-/tmp}/twilight-tests"
          shots="$GITHUB_WORKSPACE/ui-test-screenshots"
          mkdir -p "$shots"
          failed=0

          # Kill the whole process group. simctl bootstatus and xcodebuild
          # otherwise wait forever when a simulator never finishes booting.
          run_with_timeout() {
            local seconds="$1"
            shift
            python3 - "$seconds" "$@" << 'PY'
          import os, signal, subprocess, sys
          seconds = int(sys.argv[1])
          cmd = sys.argv[2:]
          proc = subprocess.Popen(cmd, start_new_session=True)
          try:
              code = proc.wait(timeout=seconds)
          except subprocess.TimeoutExpired:
              print("Timed out after %ss: %s" % (seconds, " ".join(cmd)), flush=True)
              try:
                  os.killpg(proc.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              proc.wait()
              sys.exit(124)
          sys.exit(code)
          PY
          }

          run_one() {
            local label="$1"
            local devicetype="$2"
            local family="$3"
            shift 3
            if [ -z "$devicetype" ]; then
              echo "Skipping $label: no simulator device type"
              return 0
            fi
            local udid
            udid="$(xcrun simctl create "Twilight $label" "$devicetype" "$runtime_id")"
            echo "Testing $label ($family) on $udid"
            local shotdir="$shots/$label"
            mkdir -p "$shotdir"
            # Passed as xcodebuild arguments these become build settings and
            # never reach the test process. The runner only forwards variables
            # that are in xcodebuild's environment.
            export TEST_RUNNER_TWILIGHT_SCREENSHOT_DIR="$shotdir"
            if [ "$family" = "iphone" ]; then
              export TEST_RUNNER_TWILIGHT_EXPECT_LANDSCAPE=1
            else
              unset TEST_RUNNER_TWILIGHT_EXPECT_LANDSCAPE || true
            fi
            # Skip the QuickPath "slide to type" tip so it cannot cover Esc.
            local pref_dir="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Library/Preferences"
            mkdir -p "$pref_dir"
            defaults write "$pref_dir/com.apple.keyboard.preferences" DidShowContinuousPathIntroduction -bool true
            # Boot with a deadline so the first UI launch is not waiting on
            # data migration. An unbounded bootstatus call is what hung CI.
            xcrun simctl boot "$udid" || true
            python3 - "$udid" << 'PY'
          import subprocess, sys
          udid = sys.argv[1]
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], timeout=120)
          except subprocess.TimeoutExpired:
              print("bootstatus still going after 120s; xcodebuild will finish it", flush=True)
          PY
            set +e
            run_with_timeout 1500 xcodebuild test \
              -project Moonlight.xcodeproj \
              -scheme Moonlight \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$derived" \
              -parallel-testing-enabled NO \
              -maximum-concurrent-test-simulator-destinations 1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -maximum-test-execution-time-allowance 240 \
              "$@" 2>&1 | tee "$shotdir/xcodebuild.log"
            local status=${PIPESTATUS[0]}
            set -e
            # The cases can all pass and the test runner still crash while
            # exiting. That makes xcodebuild return failure after "0 failures".
            if grep -q "Test Suite 'All tests' passed" "$shotdir/xcodebuild.log" \
              && ! grep -E "with [1-9][0-9]* failure" "$shotdir/xcodebuild.log"; then
              echo "All tests passed for $label (xcodebuild exit $status)"
              status=0
            fi
            xcrun simctl shutdown all || true
            xcrun simctl delete "$udid" || true
            if [ "$status" -ne 0 ]; then
              echo "Tests failed for $label (exit $status)"
              failed=1
            fi
          }

          # One iPhone pass runs the unit tests and the UI tests together so
          # the 30 minute job cap is not spent compiling the same app twice.
          # The large phone uses the same landscape layout; iPad is the second size.
          run_one "iphone-pro" "$(cat /tmp/twilight-test-iphone)" iphone \
            -only-testing:TwilightUnitTests -only-testing:TwilightUITests
          if [ -s /tmp/twilight-test-ipad ]; then
            run_one "ipad" "$(cat /tmp/twilight-test-ipad)" ipad \
              -only-testing:TwilightUITests
          else
            echo "No iPad simulator device type is installed, so the iPad UI tests were not run."
          fi
          exit "$failed"

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ui-test-screenshots/
          if-no-files-found: warn

  ui-screenshots:
    name: UI screenshots (iOS Simulator)
    needs: [build, build-tvos, visionos, ios27-launch, test]
    if: ${{ always() && needs.build.result == 'success' && needs.build-tvos.result == 'success' }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "iOS platform download attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "iOS platform download failed after 3 attempts"
          exit 1

      - name: Capture before and after screenshots
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/ui-screenshots"
          mkdir -p "$out"

          python3 - << 'PY'
          import json, subprocess, sys
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))
          ios = [r for r in runtimes.get("runtimes", []) if r.get("isAvailable") and str(r.get("platform")) == "iOS"]
          if not ios:
              print("NO_IOS_RUNTIME")
              sys.exit(0)
          ios.sort(key=lambda r: [int(p) if p.isdigit() else 0 for p in str(r.get("version", "0")).split(".")])
          chosen = ios[-1]
          open("/tmp/twilight-runtime-id", "w").write(chosen["identifier"])
          print(chosen["identifier"], chosen.get("version"))
          PY
          if [ ! -s /tmp/twilight-runtime-id ]; then
            echo "No iOS simulator runtime is installed, so UI screenshots were not captured."
            exit 1
          fi
          runtime_id="$(cat /tmp/twilight-runtime-id)"

          python3 - "$runtime_id" << 'PY'
          import json, subprocess, sys
          runtime = sys.argv[1]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          names = [d.get("name", "") for d in types.get("devicetypes", [])]
          def pick(exact, prefixes):
              for name in exact:
                  if name in names:
                      return name
              for prefix in prefixes:
                  for name in names:
                      if name.startswith(prefix):
                          return name
              return None
          iphone = pick(["iPhone 17 Pro"], ["iPhone 17", "iPhone 16 Pro", "iPhone 16", "iPhone"])
          ipad = pick(
              ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"],
              ["iPad Pro 13", "iPad Pro 11", "iPad"],
          )
          if not iphone or not ipad:
              sys.exit("Could not find an iPhone and iPad simulator device type")
          open("/tmp/twilight-iphone-type", "w").write(iphone)
          open("/tmp/twilight-ipad-type", "w").write(ipad)
          print(iphone)
          print(ipad)
          PY

          build_app() {
            local src="$1"
            local dd="$2"
            local appfile="$3"
            if ! xcodebuild -project "$src/Moonlight.xcodeproj" -scheme Moonlight -configuration Debug -sdk iphonesimulator -derivedDataPath "$dd" build >"$dd-build.log" 2>&1; then
              echo "xcodebuild failed for $src"
              tail -n 80 "$dd-build.log"
              exit 1
            fi
            find "$dd/Build/Products" -name Moonlight.app -path '*iphonesimulator*' | head -1 > "$appfile" || true
          }

          # One simulator build. A second xcodebuild in this job was still
          # running when the runner was torn down and the log never landed.
          echo "Building this commit for screenshots at $(date -u +%H:%M:%S)"
          build_app "$GITHUB_WORKSPACE" /tmp/dd-after /tmp/twilight-after-app
          after_app="$(cat /tmp/twilight-after-app)"
          echo "App: $after_app"
          test -d "$after_app"

          boot_device() {
            local name="$1"
            local type="$2"
            local udid
            udid="$(xcrun simctl create "$name" "$type" "$runtime_id")"
            xcrun simctl boot "$udid" || true
            # bootstatus -b waits on SpringBoard and often never returns on
            # this runner. The device is usable once simctl lists it as Booted.
            python3 - "$udid" << 'PY'
          import subprocess, sys, time
          udid = sys.argv[1]
          for _ in range(36):
              listed = subprocess.run(["xcrun", "simctl", "list", "devices"], capture_output=True, text=True).stdout
              for line in listed.splitlines():
                  if udid in line and "(Booted)" in line:
                      sys.exit(0)
              time.sleep(5)
          sys.exit("simulator %s was not Booted after 3 minutes" % udid)
          PY
            printf '%s' "$udid" > /tmp/twilight-booted-udid
          }

          install_app() {
            local udid="$1"
            local app="$2"
            xcrun simctl terminate "$udid" io.github.neguete10.twilight.ios || true
            xcrun simctl install "$udid" "$app"
          }

          shot() {
            local udid="$1"
            local appearance="$2"
            local mode="$3"
            local file="$4"
            xcrun simctl ui "$udid" appearance "$appearance" || true
            xcrun simctl terminate "$udid" io.github.neguete10.twilight.ios || true
            if [ -n "$mode" ]; then
              SIMCTL_CHILD_TWILIGHT_SCREENSHOT="$mode" xcrun simctl launch "$udid" io.github.neguete10.twilight.ios
            else
              xcrun simctl launch "$udid" io.github.neguete10.twilight.ios
            fi
            sleep 4
            xcrun simctl io "$udid" screenshot "$file"
            echo "Wrote $file"
          }

          png_size() {
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(); w,h=struct.unpack(">II", d[16:24]); print("%d %d"%(w,h))' "$1"
          }

          # The iPhone app draws landscape, but simctl's framebuffer stays
          # portrait, with the interface top along the right edge. Three
          # clockwise quarter-turns put the header at the top and make the
          # file wider than it is tall. iPad shots stay as captured.
          upright_iphone() {
            local file="$1"
            local size w h
            size="$(png_size "$file")"
            w="${size%% *}"
            h="${size##* }"
            echo "$file captured ${w}x${h}"
            if [ "$h" -gt "$w" ]; then
              sips -r 270 "$file" >/dev/null
              size="$(png_size "$file")"
              w="${size%% *}"
              h="${size##* }"
              echo "$file rotated to ${w}x${h}"
            fi
            if [ "$w" -le "$h" ]; then
              echo "$file is still not landscape (${w}x${h})"
              exit 1
            fi
          }

          boot_device "Twilight iPhone" "$(cat /tmp/twilight-iphone-type)"
          iphone="$(cat /tmp/twilight-booted-udid)"
          install_app "$iphone" "$after_app"
          for mode in empty library hosts hostsheet settings resolution pairing addhost unpaired loading video stream returnstream; do
            shot "$iphone" dark "$mode" "$out/after-iphone-${mode}-landscape-dark.png"
            upright_iphone "$out/after-iphone-${mode}-landscape-dark.png"
          done
          shot "$iphone" light library "$out/after-iphone-library-landscape-light.png"
          shot "$iphone" light settings "$out/after-iphone-settings-landscape-light.png"
          upright_iphone "$out/after-iphone-library-landscape-light.png"
          upright_iphone "$out/after-iphone-settings-landscape-light.png"
          xcrun simctl shutdown "$iphone" || true

          boot_device "Twilight iPad" "$(cat /tmp/twilight-ipad-type)"
          ipad="$(cat /tmp/twilight-booted-udid)"
          install_app "$ipad" "$after_app"
          for mode in empty library hostsheet settings video stream; do
            shot "$ipad" dark "$mode" "$out/after-ipad-${mode}-portrait-dark.png"
          done
          xcrun simctl shutdown "$ipad" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
